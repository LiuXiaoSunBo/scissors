name: Deploy Scissors to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Check ts-nocheck guard
        run: npm run guard:nocheck

      - name: Run smoke tests
        run: npm run test:smoke

      # 根据仓库名自动设置 GitHub Pages 的资源基础路径。
      # 当前仓库名为 scissors，因此最终基础路径是 /scissors/。
      - name: Build website
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      # 构建项目文档，并放入 /docs/ 子目录。
      - name: Install documentation dependencies
        run: npm ci
        working-directory: docs-site

      - name: Build documentation
        run: npm run docs:build
        working-directory: docs-site

      - name: Add documentation to Pages artifact
        run: |
          mkdir -p dist/docs
          cp -r docs-site/.vitepress/dist/. dist/docs/

      # Vite 原本把游戏生成在 dist/scissors/index.html。
      # 将它复制为 Pages 首页，使 /scissors/ 直接进入游戏。
      - name: Make Scissors the homepage
        run: cp dist/scissors/index.html dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
